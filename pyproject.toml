[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tabular-xai-mcp"
version = "0.1.0"
description = "Automated tabular ML training, LightGBM-vs-PyTorch baseline benchmarking, probability calibration and SHAP explainability — exposed as a CLI and a Model Context Protocol server. Dual-artifact output: a compact manifest.json for LLM agents and a standalone interactive report.html for humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aleksandar Jovanović" }]
keywords = [
    "mcp", "model-context-protocol", "explainability", "shap", "lightgbm",
    "pytorch", "tabular", "calibration", "benchmarking", "xai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.2",
    "torch>=2.2",
    "shap>=0.46",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "plotly>=5.20",
    "jinja2>=3.1",
    "mcp[cli]>=1.3.0,<2",  # v1 FastMCP API (v2 renamed it to MCPServer)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tabular-xai = "tabular_xai.cli:main"
tabular-xai-mcp = "tabular_xai.mcp_server:main"

[project.urls]
Homepage = "https://github.com/LatentVirtue/TabularXAI-MCP"
Issues = "https://github.com/LatentVirtue/TabularXAI-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# Resolve torch from the CPU wheel index so headless/agent machines do not
# pull multi-GB CUDA wheels. Plain `pip install .` still gets default wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
